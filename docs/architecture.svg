<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 704" width="1000" height="704" font-family="DejaVu Sans, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1000" height="704" fill="#ffffff"/>
<text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#2C2C2A">CJA Audit Agent: final architecture</text>

<rect x="250" y="48" width="500" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="500" y="75" text-anchor="middle" font-size="14" font-weight="bold" fill="#042C53">Browser UI: CJA Audit | Ask the docs | Data Feeds (classic)</text>
<line x1="500" y1="94" x2="500" y2="110" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="112" width="920" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5"/>
<text x="500" y="134" text-anchor="middle" font-size="14" font-weight="bold" fill="#042C53">Express server (Node.js)</text>
<text x="500" y="154" text-anchor="middle" font-size="12" fill="#042C53">routes, input validation, optional Adobe SSO login; with login off: localhost only and no cross-origin requests</text>

<line x1="185" y1="168" x2="185" y2="188" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="168" x2="500" y2="188" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="815" y1="168" x2="815" y2="188" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>

<rect x="40" y="190" width="290" height="170" rx="10" fill="#F4FBF8" stroke="#0F6E56"/>
<text x="185" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">Audit engine (read-only code)</text>
<rect x="55" y="226" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="185" y="249" text-anchor="middle" font-size="13" fill="#04342C">Connection checks</text>
<rect x="55" y="270" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="185" y="293" text-anchor="middle" font-size="13" fill="#04342C">Data view checks</text>
<rect x="55" y="314" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="185" y="337" text-anchor="middle" font-size="13" fill="#04342C">Feed pre-flight + feed-rules.json</text>

<rect x="355" y="190" width="290" height="170" rx="10" fill="#F4FBF8" stroke="#0F6E56"/>
<text x="500" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">Retrieval over the CJA notes (RAG)</text>
<rect x="370" y="226" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="500" y="249" text-anchor="middle" font-size="13" fill="#04342C">Heading-aware chunks (53)</text>
<rect x="370" y="270" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="500" y="293" text-anchor="middle" font-size="13" fill="#04342C">Local embeddings + BM25 keywords</text>
<rect x="370" y="314" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="500" y="337" text-anchor="middle" font-size="13" fill="#04342C">"Not covered" gate on meaning only</text>

<rect x="670" y="190" width="290" height="170" rx="10" fill="#F7F6FF" stroke="#534AB7"/>
<text x="815" y="212" text-anchor="middle" font-size="13" font-weight="bold" fill="#26215C">Answer and output layer</text>
<rect x="685" y="226" width="260" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="815" y="249" text-anchor="middle" font-size="13" fill="#26215C">Claude API: cited explanation, Q&amp;A</text>
<rect x="685" y="270" width="260" height="36" rx="6" fill="#EEEDFE" stroke="#534AB7"/><text x="815" y="293" text-anchor="middle" font-size="13" fill="#26215C">No API key: copy-ready prompt</text>
<rect x="685" y="314" width="260" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56"/><text x="815" y="337" text-anchor="middle" font-size="13" fill="#04342C">Markdown report download</text>

<line x1="185" y1="362" x2="185" y2="382" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="362" x2="500" y2="382" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="815" y1="362" x2="815" y2="382" stroke="#444441" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="40" y="384" width="290" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="185" y="411" text-anchor="middle" font-size="12.5" fill="#2C2C2A">CJA API (GET only) or sample data</text>
<rect x="355" y="384" width="290" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="500" y="411" text-anchor="middle" font-size="12.5" fill="#2C2C2A">knowledge.md (paraphrased Adobe docs)</text>
<rect x="670" y="384" width="290" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A"/><text x="815" y="411" text-anchor="middle" font-size="12.5" fill="#2C2C2A">Anthropic API (optional)</text>
<text x="500" y="452" text-anchor="middle" font-size="12" fill="#5F5E5A">Findings come from code only. The model sees findings and retrieved excerpts, not raw API responses, and cannot add findings.</text>

<rect x="40" y="470" width="920" height="62" rx="8" fill="#FAEEDA" stroke="#854F0B"/>
<text x="500" y="493" text-anchor="middle" font-size="14" font-weight="bold" fill="#412402">Safety and observability (built, 77 automated tests)</text>
<text x="500" y="516" text-anchor="middle" font-size="12" fill="#412402">feed-creation gate (off by default, confirmation, audit log) · write-inventory test · skipped checks listed · fallbacks · traces</text>

<rect x="40" y="552" width="920" height="116" rx="10" fill="none" stroke="#888780" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="56" y="574" font-size="13" font-weight="bold" fill="#444441">Proposed next increment (designed, not built)</text>
<rect x="50" y="588" width="290" height="66" rx="8" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
<text x="195" y="615" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">Tree of Thoughts diagnosis</text>
<text x="195" y="637" text-anchor="middle" font-size="11.5" fill="#444441">generator, verifier, critic, decision maker</text>
<rect x="355" y="588" width="290" height="66" rx="8" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
<text x="500" y="615" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">Multi-agent roles</text>
<text x="500" y="637" text-anchor="middle" font-size="11.5" fill="#444441">triage, generator, critic, reporter</text>
<rect x="660" y="588" width="290" height="66" rx="8" fill="none" stroke="#888780" stroke-dasharray="5 4"/>
<text x="805" y="615" text-anchor="middle" font-size="13" font-weight="bold" fill="#444441">MCP server over the checks</text>
<text x="805" y="637" text-anchor="middle" font-size="11.5" fill="#444441">with CrewAI / LangChain orchestration</text>

<text x="40" y="692" font-size="12" fill="#5F5E5A">Solid boxes: built and tested. Dashed boxes: proposed. Teal: code. Purple: language model. Gray: data. Amber: safety.</text>
</svg>
