<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Internal Assistant</title>
  <link rel="stylesheet" href="/widget.css" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fbfaf7;
      color: #1c2b2d;
      margin: 0;
      padding: 0;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid #dcd8cf;
      background: white;
    }
    .topbar-user { font-size: 14px; color: #55605e; }
    .topbar-user strong { color: #1c2b2d; }
    .topbar a {
      font-size: 13px;
      color: #2f6f5e;
      text-decoration: none;
      font-weight: 600;
    }
    .topbar a:hover { text-decoration: underline; }
    main {
      padding: 60px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #55605e; max-width: 480px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-user" id="userInfo">Loading...</div>
    <a href="/auth/logout">Log out</a>
  </div>

  <main>
    <h1>CJA Assistant (legacy chat widget demo)</h1>
    <p>Ask about CJA connections, data views, or data feeds. The chat bubble in the bottom-right corner is ready to go.</p>
  </main>

  <script>
    fetch('/api/me')
      .then((r) => r.json())
      .then((data) => {
        document.getElementById('userInfo').innerHTML =
          `Signed in as <strong>${data.user.name || data.user.email}</strong>`;
      })
      .catch(() => {
        document.getElementById('userInfo').textContent = 'Not signed in';
      });
  </script>

  <script src="/widget.js" data-api-url="/api/chat"></script>
</body>
</html>
